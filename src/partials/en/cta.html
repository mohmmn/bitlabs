<section class="section-tight" aria-labelledby="cta-title">
  <div class="container">
    <div class="cta-panel">
      <div class="cta-copy">
        <span class="eyebrow on-dark">Contact</span>
        <h2 id="cta-title">Let's talk about your project.</h2>
        <p>Every project gets its own quote, prepared after a first conversation by email or phone.</p>
        <div class="cta-actions">
          <a class="btn btn-light" href="{{link:contact}}">Contact us {{> arrow}}</a>
          <a href="mailto:{{contact.email}}">{{contact.email}}</a>
        </div>
      </div>
      <img class="cta-mark" src="/assets/img/icone.svg" alt="" width="180" height="180" loading="lazy">
    </div>
  </div>
</section>
