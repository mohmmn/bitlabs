<section class="section-tight" aria-labelledby="cta-titre">
  <div class="container">
    <div class="cta-panel">
      <div class="cta-copy">
        <span class="eyebrow on-dark">Contact</span>
        <h2 id="cta-titre">Parlons de votre projet.</h2>
        <p>Chaque projet fait l'objet d'un devis, établi après un premier échange par e-mail ou par téléphone.</p>
        <div class="cta-actions">
          <a class="btn btn-light" href="{{link:contact}}">Nous contacter {{> arrow}}</a>
          <a href="mailto:{{contact.email}}">{{contact.email}}</a>
        </div>
      </div>
      <img class="cta-mark" src="/assets/img/icone.svg" alt="" width="180" height="180" loading="lazy">
    </div>
  </div>
</section>
